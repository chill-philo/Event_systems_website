<!doctype html>
<html lang="en">

<head>
    <title>Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2 class="mb-3">Your Cart</h2>

    {% if cart %}
        {% for item in cart %}
            <div class="card mb-3 shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center">

                    <div>
                        <h5 class="mb-1">{{ item.service.name }}</h5>
                        <small class="text-muted">{{ item.service.description }}</small>
                    </div>

                    <div class="d-flex align-items-center">
                        <a href="{% url 'decrease_quantity' item.id %}" class="btn btn-outline-secondary btn-sm">−</a>
                        <span class="mx-2 fw-semibold">{{ item.quantity }}</span>
                        <a href="{% url 'increase_quantity' item.id %}" class="btn btn-outline-secondary btn-sm">+</a>
                    </div>

                    <div class="text-end">
                        <div class="fw-bold">UGX {{ item.total_price }}</div>
                        <a href="{% url 'remove_from_cart' item.id %}" class="text-danger small">Remove</a>
                    </div>

                </div>
            </div>
        {% endfor %}

        <div class="card p-3 shadow-sm mt-3">
            <div class="d-flex justify-content-between">
                <span class="fw-bold">Total</span>
                <span class="fw-bold">UGX {{ total }}</span>
            </div>
            <a href="{% url 'checkout' %}" class="btn btn-primary mt-3 w-100">Proceed to Checkout</a>
        </div>

    {% else %}
        <p class="text-muted mt-3">Your cart is empty.</p>
    {% endif %}

</div>

</body>
</html>
